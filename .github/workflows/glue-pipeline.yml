name: Deploy and run Glue medallion pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "glue_jobs/*.py"
      - ".github/workflows/glue-pipeline.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: amazon-reviews-glue-pipeline
  cancel-in-progress: false

jobs:
  deploy-and-run:
    name: Deploy and run Bronze, Silver, and Gold
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --no-cli-pager

      - name: Upload Glue scripts to configured job locations
        shell: bash
        run: |
          set -euo pipefail

          deploy_glue_script() {
            local job_name="$1"
            local local_script="$2"
            local script_uri
            local local_hash
            local deployed_hash

            script_uri=$(aws glue get-job \
              --job-name "$job_name" \
              --query 'Job.Command.ScriptLocation' \
              --output text \
              --no-cli-pager)

            if [[ -z "$script_uri" || "$script_uri" == "None" ]]; then
              echo "::error::${job_name} has no configured ScriptLocation"
              return 1
            fi

            echo "Uploading ${local_script} to ${script_uri}"
            aws s3 cp "$local_script" "$script_uri" --no-cli-pager

            local_hash=$(sha256sum "$local_script" | awk '{print $1}')
            deployed_hash=$(aws s3 cp "$script_uri" - --no-cli-pager \
              | sha256sum | awk '{print $1}')

            if [[ "$local_hash" != "$deployed_hash" ]]; then
              echo "::error::Deployment verification failed for ${job_name}"
              return 1
            fi

            echo "Verified ${job_name} script: ${deployed_hash}"
          }

          deploy_glue_script "amazon-reviews-bronze" "glue_jobs/bronze.py"
          deploy_glue_script "amazon-reviews-silver" "glue_jobs/silver.py"
          deploy_glue_script "amazon-reviews-gold" "glue_jobs/gold.py"

      - name: Run Bronze, Silver, and Gold sequentially
        shell: bash
        run: |
          set -euo pipefail

          run_glue_job() {
            local job_name="$1"
            local run_id
            local state

            run_id=$(aws glue start-job-run \
              --job-name "$job_name" \
              --query JobRunId \
              --output text \
              --no-cli-pager)

            echo "Started ${job_name}: ${run_id}"

            while true; do
              state=$(aws glue get-job-run \
                --job-name "$job_name" \
                --run-id "$run_id" \
                --query JobRun.JobRunState \
                --output text \
                --no-cli-pager)

              echo "${job_name} state: ${state}"

              case "$state" in
                SUCCEEDED)
                  return 0
                  ;;
                FAILED|TIMEOUT|STOPPED|ERROR|EXPIRED)
                  echo "::error::${job_name} finished with state ${state}"
                  echo "Glue job-run details:"
                  aws glue get-job-run \
                    --job-name "$job_name" \
                    --run-id "$run_id" \
                    --query 'JobRun.{State:JobRunState,ErrorMessage:ErrorMessage,ExecutionTime:ExecutionTime,GlueVersion:GlueVersion,LogGroupName:LogGroupName}' \
                    --output json \
                    --no-cli-pager || true

                  return 1
                  ;;
              esac

              sleep 30
            done
          }

          run_glue_job "amazon-reviews-bronze"
          run_glue_job "amazon-reviews-silver"
          run_glue_job "amazon-reviews-gold"
